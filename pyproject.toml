[build-system]
requires = ["setuptools~=77.0"]
build-backend = "setuptools.build_meta"

[project]
name         = "power-pilot-frontend"
version      = "20260424.2"
license      = "Apache-2.0"
license-files = ["LICENSE*"]
description  = "The Power Pilot frontend"
readme       = "README.md"
authors      = [
    {name = "The Power Pilot Authors", email = "kristof@powerlabs.be"}
]
requires-python = ">=3.14.0"

[project.urls]
"Homepage" = "https://github.com/PowerLabs-be/power-pilot-frontend"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["power_pilot_frontend*"]
